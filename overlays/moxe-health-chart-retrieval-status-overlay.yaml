overlay: 1.0.0
info:
  title: API Evangelist enhancements for Moxe Health Chart Retrieval (Get Status)
  version: 1.0.0
extends: openapi/moxe-health-chart-retrieval-status-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-enrichment:
      auth: OAuth2 client-credentials (15-min token) + x-api-key header; partner-onboarded.
      polling: Poll with the moxeRequestId returned by the initiate call; read requestStatusCode.
- target: $.paths['/v1/patient-chart-request/{moxeRequestId}/status'].get
  update:
    x-apievangelist-notes: >-
      Returns the current status of a patient chart request. A 404 means the request is not
      found OR the caller is not authorized to view it.
