name: Moxe Health
kind: company
description: >-
  Moxe Health is a United States healthcare data interoperability company,
  headquartered in Madison, Wisconsin, that operates the Clinical Data Clearinghouse
  for secure clinical data exchange between health plans (payers) and health systems
  (providers). Moxe's API-first platform ingests release-of-information (ROI) requests,
  searches connected electronic health records (EHRs) to extract the minimum-necessary
  contextual clinical data for a specified patient and date range, and securely delivers
  that data to the partner's system. Its Chart Retrieval API supports risk adjustment,
  quality improvement, claim management, payment integrity, care management, and forecasting
  use cases. The public developer portal documents a REST (OpenAPI 3.0.1) Chart Retrieval
  API secured with OAuth2 client-credentials plus an x-api-key header; retrieved charts
  are returned to a predetermined location via SFTP. Moxe is HIPAA and SOC 2 Type 2
  compliant and was named number 1 Best in KLAS for Payer-Provider Data Exchange. The
  documented API is REST/JSON rather than HL7 FHIR, and full access is granted through
  a partner onboarding agreement.
